<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6ff"><meta name="description" content="Joy 第一、二冊獨立單字小花園。中文朗讀、聽音找圖、補字與點字母拼字。"><title>Joy 單字小花園</title><style>
:root{--ink:#233e49;--leaf:#287758;--pink:#d6587c;--purple:#6359a7;--sky:#eaf6ff;--yellow:#ffd67b;--line:#d7e4e8;--muted:#617780}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:ui-rounded,'Arial Rounded MT Bold','PingFang TC',system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:4px}button{min-height:48px}a{color:var(--leaf)}.shell{max-width:820px;margin:auto;padding:22px 22px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.brand{font-weight:900;letter-spacing:1px;font-size:16px}.brand span{display:inline-grid;place-items:center;border-radius:14px;background:var(--yellow);width:42px;height:42px;font-size:26px;margin-right:8px}.quiet{background:white;border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px}.eyebrow{color:var(--purple);font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:clamp(30px,6vw,46px);line-height:1.25;margin:10px 0 14px}h2{font-size:23px;margin:10px 0}h3{font-size:18px;margin:8px 0}p{margin:8px 0 16px}.muted{color:var(--muted);font-size:14px}.intro{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:18px;margin:24px 0}.garden{display:flex;align-items:end;justify-content:center;gap:12px;min-height:150px}.plant{width:74px;text-align:center;position:relative}.plant .flower{display:block;font-size:54px;line-height:1.3;transform-origin:bottom}.plant small{display:block;background:#edb6a4;border-radius:3px 3px 17px 17px;color:#724334;padding:8px;font-size:12px;font-weight:800}.plant.bloom .flower{animation:pop .4s ease-out}.panel{background:white;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 8px 0 #dceaf0;margin:20px 0}.book-tabs{display:flex;gap:10px;margin:18px 0}.book-tabs button{flex:1;border:2px solid var(--line);background:white;border-radius:17px;padding:14px;font-weight:800}.book-tabs .selected{border-color:var(--purple);background:#f0ecff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px;font-weight:800;margin:0 0 6px}select,input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px;background:white;color:var(--ink)}.full{grid-column:1/-1}.primary{background:var(--leaf);color:white;border:0;border-radius:17px;padding:15px 23px;font-weight:850;font-size:19px;box-shadow:0 4px 0 #18583e}.wide{width:100%}.soft{border:0;background:#f0ecff;color:var(--purple);border-radius:14px;padding:10px 16px;font-weight:750}.listen{background:#fff3d0;border:1px solid #f1d790;border-radius:14px;padding:11px 16px;font-weight:750}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.actions>*{flex:1}.word-preview{display:flex;flex-wrap:wrap;gap:8px}.word-preview span{border-radius:12px;padding:8px 13px;background:#f3f8fa;font-size:16px}.note{font-size:13px;color:var(--muted);margin-top:16px}.meter{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:850}.dots{display:flex;gap:8px}.dot{width:16px;height:16px;background:#d6e2e7;border-radius:50%}.dot.done{background:#55a97a}.stage{display:inline-block;color:var(--purple);background:#f0ecff;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:800}.question{min-height:420px;text-align:center}.visual{font-size:92px;line-height:1.4;margin:14px auto}.swatch{width:110px;height:110px;display:inline-block;border:3px solid #abbec8;border-radius:28px;margin:12px}.bigword{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:850;letter-spacing:1px;font-size:clamp(32px,7vw,52px);overflow-wrap:anywhere}.meaning{font-size:23px;margin:8px auto 18px;max-width:540px}.picture-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0}.picture-options button{border:2px solid var(--line);border-radius:22px;background:#f7fbfd;min-height:135px;font-size:62px}.picture-options .swatch{width:65px;height:65px;margin:0}.meaning-options{display:grid;gap:12px;margin:22px 0;text-align:left}.meaning-option{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:17px;padding:10px;background:#f7fbfd}.meaning-option>.answer{flex:1;text-align:left;font-size:21px;border:0;background:none;padding:10px}.meaning-option .listen{flex:none;font-size:17px}.letters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:24px auto}.tile{border:2px solid #c4cee6;border-bottom:5px solid #aaaed6;border-radius:14px;background:white;min-width:56px;min-height:61px;font-size:29px;font-weight:800;padding:7px 12px}.spelling-target{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;min-height:76px;margin:20px 0}.slot{min-width:38px;border-bottom:3px solid #a3b9c5;font-size:32px;font-weight:850;line-height:1.8}.missing-word{letter-spacing:.14em;font-size:clamp(27px,6vw,42px);font-weight:850;margin:28px 0}.feedback{border-radius:18px;background:#e7f5e9;color:#225e3e;padding:18px;margin:20px 0;text-align:left}.feedback.try{background:#fff2d5;color:#825628}.feedback strong{font-size:21px}.parent-info{font-size:14px;color:var(--muted);margin-top:20px}.pill{background:#fff1d2;color:#79591f;border-radius:99px;padding:5px 11px;font-size:13px;display:inline-block}.stats-list{display:grid;gap:10px}.stats-row{border-bottom:1px solid var(--line);padding:10px 0}.assist{border:2px dashed #d1b775;border-radius:15px;background:#fff8e4;padding:13px;margin-top:14px}.support-letter{border-color:var(--leaf);background:#e1f1db}.empty{padding:24px;text-align:center}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:14px;max-width:92%;z-index:10;font-size:15px}footer{margin-top:30px;font-size:12px;color:var(--muted);text-align:center}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}@media(max-width:560px){.shell{padding:16px 16px 45px}.intro{grid-template-columns:1fr;margin:14px 0}.intro .garden{min-height:100px}.plant .flower{font-size:42px}.plant{width:65px}.panel{padding:20px 16px}.fields{grid-template-columns:1fr}.picture-options{gap:8px}.picture-options button{font-size:46px;min-height:110px}.question{min-height:360px}.tile{min-width:47px;min-height:55px;font-size:25px}.actions>.listen{font-size:15px}.meter{font-size:14px}.brand{font-size:14px}.slot{min-width:29px;font-size:28px}.meaning-option>.answer{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header><div class="brand"><span>🌱</span>JOY 單字小花園</div><button class="quiet" id="home">休息一下</button></header><main id="app"><p>正在整理小花園……</p></main><footer>Joy 第一・二冊｜每天一點點，慢慢長大。</footer></div><div id="toast" role="status" hidden></div>
<script>
'use strict';
const DATA=__JOY_DATA__;
const STORAGE='joy-independent-words-v1',ENDPOINT='https://bobo-math-notify.bobo-math-grader.workers.dev';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const ALL=DATA.flatMap(b=>b.units.flatMap(u=>u.words)),dateSort=a=>a||'';
let profile={book:1,unit:1,name:'Apple',difficulty:'auto',records:{},days:{},plans:{}},storageOK=true,session=null,speechToken=0,view='home',notifyBusy=false;
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&saved.version===1&&saved.profile&&saved.profile.records&&typeof saved.profile.records==='object'&&saved.profile.days&&typeof saved.profile.days==='object'){profile={...profile,...saved.profile};}}catch(e){storageOK=false;}
if(!DATA.some(b=>b.book===Number(profile.book)))profile.book=1;
if(!DATA.find(b=>b.book===Number(profile.book)).units.some(u=>u.unit===Number(profile.unit)))profile.unit=1;
const key=w=>w.key;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,profile}));storageOK=true;return true;}catch(e){storageOK=false;toast('這台裝置暫時無法保存紀錄，仍可完成這次練習。');return false;}}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();}
function speakSequence(parts){if(!('speechSynthesis'in window)){toast('這個瀏覽器暫時無法朗讀，請換瀏覽器試試。');return;}stopSpeech();const token=speechToken;const run=i=>{if(token!==speechToken||i>=parts.length)return;const [text,lang]=parts[i],u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='en-US'?.8:.9;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang===lang)||voices.find(v=>v.lang.startsWith(lang.slice(0,2)))||null;u.onend=()=>run(i+1);u.onerror=()=>{if(token===speechToken)toast('目前無法朗讀，請確認裝置的中文或英文語音。');};speechSynthesis.speak(u);};run(0);}
const zh=text=>speakSequence([[text,'zh-TW']]),en=w=>speakSequence([[w.say||w.word,'en-US']]);
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
function selectedUnit(){return DATA.find(b=>b.book===Number(profile.book)).units.find(u=>u.unit===Number(profile.unit));}
function chooseWords(){const u=selectedUnit(),id=today()+'|'+profile.book+'|'+profile.unit;profile.plans=profile.plans||{};const existing=profile.plans[id];if(Array.isArray(existing)){const chosen=existing.map(k=>u.words.find(w=>w.key===k)).filter(Boolean);if(chosen.length)return chosen;}const chosen=u.words.slice().sort((a,b)=>dateSort(profile.records[key(a)]?.lastSeen).localeCompare(dateSort(profile.records[key(b)]?.lastSeen))||u.words.indexOf(a)-u.words.indexOf(b)).slice(0,3);profile.plans[id]=chosen.map(w=>w.key);persist();return chosen;}

function visual(w){return w.color?`<span class="swatch" style="background:${w.color}" aria-hidden="true"></span>`:w.emoji?`<span aria-hidden="true">${w.emoji}</span>`:'<span aria-hidden="true">🌱</span>';}
function pictureChoices(w){if(!w.picture)return null;const pool=ALL.filter(x=>x.key!==w.key&&x.picture&&x.zh!==w.zh&&(w.color?!!x.color:!x.color));const unique=[...new Map(shuffle(pool).map(x=>[x.color||x.emoji,x])).values()].filter(x=>(x.color||x.emoji)!==(w.color||w.emoji));if(unique.length<2)return null;return shuffle([w,...unique.slice(0,2)]);}
function meaningChoices(w){const pool=ALL.filter(x=>x.picture&&!x.color&&x.key!==w.key&&x.zh!==w.zh);const unique=[...new Map(shuffle(pool).map(x=>[x.zh,x])).values()];return shuffle([w,...unique.slice(0,2)]);}
function spellingKind(w){if(!w.spellable)return null;if(profile.difficulty==='spell')return 'spell';if(profile.difficulty==='fill')return 'fill';return (profile.records[key(w)]?.fillDays||[]).length>=2?'spell':'fill';}
function tasksFor(words){return words.flatMap(w=>[{kind:'learn',word:w},{kind:'meaning',word:w},...(spellingKind(w)?[{kind:spellingKind(w),word:w}]:[])]);}
const taskKey=t=>t.word.key+'|'+t.kind;
class Challenge{
 constructor(words){this.words=words;this.tasks=tasksFor(words);this.index=0;this.phase='first';this.wrong=new Map();this.stats={};this.feedback=null;this.prepared=null;this.hinted=new Set();this.doneWords=new Set();this.saved=false;this.notified=false;this.started=Date.now();}
 current(){return this.tasks[this.index];}
 record(ok){const t=this.current(),k=taskKey(t),s=this.stats[k]||(this.stats[k]={word:t.word.word,kind:t.kind,attempts:0,correct:0,independent:0,misses:0});const helped=this.hinted.has(k)||s.misses>=2;s.attempts++;if(ok){s.correct++;if(!helped)s.independent++;if(this.phase==='retry')this.wrong.delete(k);}else{s.misses++;if(this.phase==='first')this.wrong.set(k,t);}this.feedback={ok,helped};return this.feedback;}
 advance(){const t=this.current();if(t.kind!=='learn'&&!this.feedback)return;if(this.phase==='first'||this.feedback?.ok)this.index++;this.feedback=null;this.prepared=null;
 if(this.phase==='first')for(const w of this.words){if(!this.tasks.slice(this.index).some(t=>t.word.key===w.key))this.doneWords.add(w.key);}
 if(this.index>=this.tasks.length)this.phase=this.phase==='first'&&this.wrong.size?'reviewReady':'complete';}
 beginRetries(){this.tasks=[...this.wrong.values()];this.index=0;this.phase='retry';this.feedback=null;this.prepared=null;}
}
function garden(done=0,total=3){return `<div class="garden" aria-label="已練習 ${done} 個，共 ${total} 個字">${Array.from({length:total},(_,i)=>`<div class="plant ${i<done?'bloom':''}"><span class="flower">${i<done?'🌷':'🌱'}</span><small>第 ${i+1} 個字</small></div>`).join('')}</div>`;}
function renderHome(){view='home';const u=selectedUnit(),preview=chooseWords();$('#app').innerHTML=`<section class="intro"><div><div class="eyebrow">A LITTLE EVERY DAY</div><h1>聽一聽，<br>讓單字開花。</h1><p>今天 3 個字。先聽懂，再慢慢拼出來。</p><button class="listen" id="introListen">🔊 聽聽怎麼玩</button></div>${garden(0,preview.length)}</section><section class="panel"><div class="book-tabs" role="group" aria-label="選擇冊別">${DATA.map(b=>`<button data-book="${b.book}" class="${Number(profile.book)===b.book?'selected':''}" aria-pressed="${Number(profile.book)===b.book}">第 ${b.book===1?'一':'二'} 冊</button>`).join('')}</div><div class="fields"><div><label for="unit">現在練哪一課？</label><select id="unit">${DATA.find(b=>b.book===Number(profile.book)).units.map(u=>`<option value="${u.unit}" ${Number(profile.unit)===u.unit?'selected':''}>第 ${u.unit} 課</option>`).join('')}</select></div><div><label for="name">孩子稱呼</label><input id="name" maxlength="24" value="${esc(profile.name)}" autocomplete="off"></div><div class="full"><label for="difficulty">媽媽幫我選</label><select id="difficulty"><option value="auto" ${profile.difficulty==='auto'?'selected':''}>慢慢進步：先補字，跨日會了再拼整字</option><option value="fill" ${profile.difficulty==='fill'?'selected':''}>今天先補字</option><option value="spell" ${profile.difficulty==='spell'?'selected':''}>挑戰整字：點字母拼出來</option></select></div></div><p class="muted">第 ${profile.book} 冊 · 第 ${u.unit} 課</p><div class="word-preview">${preview.map(w=>`<span>${w.color?'🎨':w.emoji||'🌱'} ${esc(w.word)}</span>`).join('')}</div><div class="actions"><button class="primary" id="start">${session&&session.phase!=='complete'?'開始新練習':'開始今天的 3 個字'}</button>${session&&session.phase!=='complete'?'<button class="soft" id="resume">繼續剛才那一回</button>':''}</div><p class="note">聽懂、補字、自己拼，分開練。人名、片語和句子先練認識與聽懂。這回的花朵重新累積，不會拿舊成績直接過關。</p></section><details class="panel"><summary>給媽媽：紀錄與備份</summary><p class="muted">第一、二冊可分開選；相同單字共用學習歷程。紀錄存在這個瀏覽器。重新整理會重開這回的小挑戰，但已完成的學習歷程保留。</p><div class="actions"><button class="quiet" id="backup">匯出學習紀錄</button><label class="quiet" style="cursor:pointer" for="restore">匯入學習紀錄</label><input id="restore" type="file" accept=".json,application/json" hidden></div>${!storageOK?'<p>目前無法讀寫原有紀錄，請先保留備份再處理。</p>':''}</details>`;
 $('#introListen').onclick=()=>zh('先選第一冊或第二冊，再選你上到的那一課。今天一起認識三個單字。聽一聽，再補字。做錯的題目，最後再一起練習。');
 document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{profile.book=Number(b.dataset.book);profile.unit=1;persist();renderHome();});
 $('#unit').onchange=e=>{profile.unit=Number(e.target.value);persist();renderHome();};$('#name').onchange=e=>{profile.name=e.target.value.trim().slice(0,24)||'Apple';persist();};$('#difficulty').onchange=e=>{profile.difficulty=e.target.value;persist();};
 $('#start').onclick=()=>{profile.name=$('#name').value.trim().slice(0,24)||'Apple';persist();session=new Challenge(chooseWords());session.book=Number(profile.book);session.unit=Number(profile.unit);session.name=profile.name;renderTask();};if($('#resume'))$('#resume').onclick=renderTask;
 $('#backup').onclick=exportProgress;$('#restore').onchange=importProgress;
}
function prepareTask(t){if(session.prepared)return session.prepared;const st=session.stats[taskKey(t)],helped=session.hinted.has(taskKey(t))||(st?.misses||0)>=2;let p={helped};if(t.kind==='meaning'){p.pictures=pictureChoices(t.word);p.options=p.pictures||meaningChoices(t.word);}if(t.kind==='fill'){const letters=t.word.word.toLowerCase().split('');let i=letters.findIndex((c,i)=>i>0&&'aeiou'.includes(c));if(i<0)i=Math.floor(letters.length/2);p.blank=i;p.answer=letters[i];p.display=letters.map((c,j)=>j===i?'＿':c).join(' ');const alternatives=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>c!==p.answer)).slice(0,2);p.options=shuffle([p.answer,...alternatives]);}if(t.kind==='spell'){p.tiles=shuffle(t.word.word.toLowerCase().split('').map((c,i)=>({c,i})));p.picked=[];}session.prepared=p;return p;}
function promptText(t){return t.kind==='learn'?'先認識這個字。':t.kind==='meaning'?'聽一聽，找出它的意思。':t.kind==='fill'?'聽單字，補上少掉的字母。':'聽單字，點字母把它拼出來。';}
function renderTask(){if(!session)return renderHome();view='practice';if(session.phase==='reviewReady')return renderReviewReady();if(session.phase==='complete')return renderComplete();const t=session.current(),w=t.word,p=prepareTask(t),f=session.feedback;const done=session.doneWords.size,total=session.words.length;let content='';
 if(t.kind==='learn')content=`<div class="visual">${visual(w)}</div><div class="bigword">${esc(w.word)}</div><p class="meaning">${esc(w.zh)}</p><div class="actions"><button class="listen" data-en>🔊 聽英文</button><button class="listen" data-zh>🔊 聽中文</button></div><button class="primary wide" id="learnNext">準備好了，試試看</button>`;
 if(t.kind==='meaning'){content=`<p class="meaning">${p.pictures?'哪張圖呢？':'哪一個意思呢？'}</p><button class="listen" data-en>🔊 再聽一次英文</button>`;content+=p.pictures?`<div class="picture-options">${p.options.map((x,i)=>`<button data-answer="${i}" aria-label="選擇第 ${i+1} 張圖" ${f?'disabled':''}>${visual(x)}</button>`).join('')}</div>`:`<div class="meaning-options">${p.options.map((x,i)=>`<div class="meaning-option"><button class="answer" data-answer="${i}" ${f?'disabled':''}>${esc(x.zh)}</button><button class="listen" data-option-zh="${i}" aria-label="朗讀第 ${i+1} 個中文選項">🔊</button></div>`).join('')}</div>`;}
 if(t.kind==='fill')content=`<div class="visual">${visual(w)}</div><p class="meaning">${esc(w.zh)}</p><div class="actions"><button class="listen" data-en>🔊 聽英文</button><button class="listen" data-zh>🔊 聽中文</button></div><div class="missing-word" aria-label="${esc(p.display)}">${esc(p.display)}</div><div class="letters">${p.options.map(c=>`<button class="tile ${p.helped&&c===p.answer?'support-letter':''}" data-letter="${c}" ${f?'disabled':''}>${c}</button>`).join('')}</div>`;
 if(t.kind==='spell')content=`<div class="visual">${visual(w)}</div><p class="meaning">${esc(w.zh)}</p><div class="actions"><button class="listen" data-en>🔊 聽英文</button><button class="listen" data-zh>🔊 聽中文</button></div><div class="spelling-target" aria-label="你拼的單字">${w.word.split('').map((c,i)=>`<span class="slot">${esc(p.picked[i]?.c||'　')}</span>`).join('')}</div><div class="letters">${p.tiles.map((tile,i)=>`<button class="tile ${p.helped&&tile.c===w.word.toLowerCase()[p.picked.length]?'support-letter':''}" data-tile="${i}" ${f||p.picked.some(x=>x.i===tile.i)?'disabled':''}>${tile.c}</button>`).join('')}</div><div class="actions"><button class="soft" id="undo" ${f?'disabled':''}>退一個字母</button><button class="primary" id="check" ${f?'disabled':''}>拼好了</button></div>`;
 if(p.helped&&t.kind!=='learn')content+=`<div class="assist">一起看一看：<b>${esc(w.word)}</b><br>跟著提示再做一次。這次會記成「有幫忙」。</div>`;
 if(f)content+=`<div class="feedback ${f.ok?'':'try'}" role="status"><strong>${f.ok?'做到了！':'一起記住它。'}</strong><div class="bigword" style="font-size:29px">${esc(w.word)}</div><p>${esc(w.zh)}</p><button class="listen" data-en>🔊 聽一遍再記住</button></div><button class="primary wide" id="next">${f.ok?'繼續 →':session.phase==='first'?'先往前，最後再練這題 →':'有提示，再試一次 →'}</button>`;
 $('#app').innerHTML=`<div class="meter"><span>新字：已練 ${done} / ${total} 個</span><div class="dots">${session.words.map(x=>`<i class="dot ${session.doneWords.has(x.key)?'done':''}"></i>`).join('')}</div></div><section class="panel question"><div class="stage">${session.phase==='retry'?'錯題小挑戰（不增加新字）':t.kind==='learn'?'認識新朋友':t.kind==='meaning'?'聽懂挑戰':t.kind==='fill'?'補字挑戰':'整字挑戰'}</div><h2>${promptText(t)}</h2><button class="quiet" id="instruction">🔊 聽題目怎麼做</button>${content}${!f&&t.kind!=='learn'?'<p><button class="quiet" id="hint">需要幫忙</button></p>':''}</section>`;
 bindSounds(w);$('#instruction').onclick=()=>speakSequence([[promptText(t),'zh-TW'],...(t.kind!=='learn'?[[w.say||w.word,'en-US']]:[])]);
 if($('#learnNext'))$('#learnNext').onclick=()=>{session.advance();renderTask();en(w);};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>grade(p.options[Number(b.dataset.answer)].key===w.key));document.querySelectorAll('[data-option-zh]').forEach(b=>b.onclick=()=>zh(p.options[Number(b.dataset.optionZh)].zh));document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>grade(b.dataset.letter===p.answer));
 document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{p.picked.push(p.tiles[Number(b.dataset.tile)]);renderTask();});if($('#undo'))$('#undo').onclick=()=>{p.picked.pop();renderTask();};if($('#check'))$('#check').onclick=()=>{if(p.picked.length!==w.word.length){zh('還有字母沒有放進來，慢慢來。');return;}grade(p.picked.map(x=>x.c).join('')===w.word.toLowerCase());};
 if($('#hint'))$('#hint').onclick=()=>{session.hinted.add(taskKey(t));p.helped=true;renderTask();speakSequence([['一起看一看，跟著再試一次。','zh-TW'],[w.say||w.word,'en-US']]);};if($('#next'))$('#next').onclick=()=>{session.advance();renderTask();};window.scrollTo({top:0,behavior:'instant'});
}
function bindSounds(w){document.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>en(w));document.querySelectorAll('[data-zh]').forEach(b=>b.onclick=()=>zh(w.zh));}
function grade(ok){if(session.feedback)return;session.record(ok);renderTask();zh(ok?'做到了！':session.phase==='first'?'一起記住它，最後再練這一題。':'慢慢來，一起看提示再試一次。');}
function renderReviewReady(){view='practice';$('#app').innerHTML=`<section class="panel empty"><span class="stage">作答已完成</span><h1>三個小種子，<br>都練過了。</h1>${garden(session.words.length,session.words.length)}<p>還有 ${session.wrong.size} 題，陪它再長大一點。</p><button class="listen" id="reviewListen">🔊 聽接下來怎麼玩</button><div class="actions"><button class="primary" id="retry">開始錯題挑戰</button></div><p class="muted">這些都是剛才的字，不會增加新字。</p></section>`;$('#retry').onclick=()=>{session.beginRetries();renderTask();};$('#reviewListen').onclick=()=>zh('今天的新字都練過了。接下來，把剛才需要幫忙的題目再練一次，不會增加新的單字。');window.scrollTo(0,0);}
function saveCompleted(){if(session.saved)return;const date=today();for(const w of session.words){const r=profile.records[key(w)]||(profile.records[key(w)]={fillDays:[],spellDays:[]});r.lastSeen=date;for(const kind of ['fill','spell']){const stat=session.stats[w.key+'|'+kind];if(stat?.independent>0&&!r[kind+'Days'].includes(date))r[kind+'Days'].push(date);}}profile.days[date]=(profile.days[date]||0)+session.words.length;persist();session.saved=true;}
const kinds={meaning:'聽懂',fill:'補字',spell:'整字拼寫'};
function completionMessage(){const rows=Object.values(session.stats),attempts=rows.reduce((n,x)=>n+x.attempts,0);return `${session.name} Joy 單字小花園完成。\n第一／二冊：第 ${session.book} 冊，第 ${session.unit} 課\n日期：${today()}\nCompleted ${session.words.length} / ${session.words.length} 個字\n總練習：${attempts} 次\n完成項目：認識單字、聽懂挑戰、適用的補字／拼字、錯題挑戰\n口說練習：本頁自由跟讀，未錄音計次\n星星紀錄：未使用星等評分\n單字明細：\n${rows.map(x=>`${x.word} · ${kinds[x.kind]}：${x.attempts} 次，無提示答對 ${x.independent} 次${x.correct>x.independent?'，含有幫忙完成':''}`).join('\n')}`;}
function renderComplete(){view='complete';saveCompleted();$('#app').innerHTML=`<section class="panel empty"><span class="stage">恭喜完成</span><h1>今天的小花，<br>開好了！</h1>${garden(session.words.length,session.words.length)}<div class="word-preview" style="justify-content:center">${session.words.map(w=>`<span>${esc(w.word)}</span>`).join('')}</div><p>新字 ${session.words.length} 個，錯題挑戰也完成了。</p><button class="listen" id="celebrate">🔊 聽聽鼓勵</button></section><section class="panel"><h2>給媽媽看一看</h2><p class="muted">聽懂、補字和整字拼寫分開記錄；使用提示完成，也會如實列出。</p><div class="stats-list">${Object.values(session.stats).map(x=>`<div class="stats-row"><b>${esc(x.word)}</b> · ${kinds[x.kind]}<br>${x.attempts} 次練習，${x.independent} 次無提示答對${x.correct>x.independent?' · 有幫忙完成':''}</div>`).join('')}</div><div class="actions"><button id="notify" class="primary" ${session.notified||notifyBusy?'disabled':''}>${session.notified?'✓ 已通知 Emma':notifyBusy?'正在傳送…':'媽媽確認完成，通知 Emma'}</button></div><p id="notifyStatus" role="status" class="muted">${session.notified?'這次完成紀錄已傳送。':'媽媽確認後才會傳送，不會自動發送。'}</p><button class="soft wide" id="backHome">回到小花園</button></section>`;$('#celebrate').onclick=()=>zh('今天的三個小種子，都長大了。你願意再試一次，很棒！');$('#backHome').onclick=renderHome;$('#notify').onclick=notifyParent;window.scrollTo(0,0);}
async function notifyParent(){if(!session||session.phase!=='complete'||session.wrong.size||session.notified||notifyBusy)return;const target=session,message=completionMessage();notifyBusy=true;renderComplete();const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),15000);try{const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:message}),signal:abort.signal});const result=await response.json();if(!response.ok||result.ok!==true)throw Error();target.notified=true;toast('已把這次的練習紀錄傳給 Emma。');}catch(e){toast('還沒傳送成功，請檢查網路後再按一次。');}finally{clearTimeout(timer);notifyBusy=false;if(session===target&&view==='complete')renderComplete();}}
function exportProgress(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({app:STORAGE,version:1,profile},null,2)],{type:'application/json'}));a.href=url;a.download='Joy單字學習紀錄-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importProgress(e){const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();const x=JSON.parse(await f.text());if(x.app!==STORAGE||x.version!==1||!x.profile||!x.profile.records||typeof x.profile.records!=='object'||Array.isArray(x.profile.records)||!x.profile.days||![1,2].includes(Number(x.profile.book))||!Number.isInteger(Number(x.profile.unit))||x.profile.unit<1||x.profile.unit>20)throw Error();const ids=new Set(ALL.map(w=>w.key));for(const [id,r] of Object.entries(x.profile.records)){if(!ids.has(id)||!r||!Array.isArray(r.fillDays)||!Array.isArray(r.spellDays)||[...r.fillDays,...r.spellDays].some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d)))throw Error();}profile={...profile,...x.profile};session=null;persist();renderHome();toast('學習紀錄已匯入。');}catch(err){toast('這不是有效的 Joy 單字學習紀錄。');}}
$('#home').onclick=()=>{stopSpeech();renderHome();};renderHome();
</script></body></html>
