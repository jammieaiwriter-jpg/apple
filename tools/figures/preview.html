  :root {

    --paper: #fffdf7;
    --card: #ffffff;
    --accent: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'PingFang TC','Microsoft JhengHei','Helvetica Neue',sans-serif;
    background: linear-gradient(180deg, #fff7ed 0%, #fdf4e3 100%);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
    text-align: center;
  }
  header h1 {
    font-size: 28px;
    margin: 0 0 6px;
  }
  header p {
    margin: 4px 0;
    color: #6b5f4f;
    font-size: 14px;
  }
  #status {
    max-width: 1100px;
    margin: 0 auto 20px;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
  }
  #status.ok { background: #dcfce7; color: #166534; border: 2px solid #86efac; }
  #status.fail { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }

  main { max-width: 1100px; margin: 0 auto; }

  section.component {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    border: 2px solid #f3ead9;
  }
  section.component h2 {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 4px;
    font-size: 20px;
  }
  section.component h2 .no {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
  }
  section.component .desc {
    margin: 0 0 16px;
    color: #6b5f4f;
    font-size: 13px;
  }
  .variants {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .variant {
    flex: 1 1 260px;
    max-width: 320px;
    background: #fafaf9;
    border: 1px solid #e7e0d3;
    border-radius: 12px;
    padding: 12px;
  }
  .variant .figure-box {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    border-radius: 8px;
    padding: 8px;
    min-height: 120px;
    overflow: auto;
  }
  .variant .figure-box svg { max-width: 100%; height: auto; }
  .variant pre {
    margin: 10px 0 0;
    font-size: 11px;
    background: #1f2937;
    color: #d1fae5;
    padding: 8px 10px;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .variant .err {
    color: #b91c1c;
    font-weight: 700;
    font-size: 13px;
    padding: 10px;
  }
  footer {
    max-width: 1100px;
    margin: 30px auto 0;
    text-align: center;
    color: #9a8f7a;
    font-size: 12px;
  }
</style>
</head>

</header>

const app = document.getElementById("app");
const statusEl = document.getElementById("status");
let errorCount = 0;
let renderCount = 0;

for (const comp of COMPONENTS) {
  const section = document.createElement("section");
  section.className = "component";

  const h2 = document.createElement("h2");
  h2.innerHTML = `<span class="no">${comp.no}</span> ${comp.title}`;
  section.appendChild(h2);

  const desc = document.createElement("p");
  desc.className = "desc";
  desc.textContent = comp.desc;
  section.appendChild(desc);

  const variantsWrap = document.createElement("div");
  variantsWrap.className = "variants";

  for (const v of comp.variants) {
    const box = document.createElement("div");
    box.className = "variant";

    const figBox = document.createElement("div");
    figBox.className = "figure-box";

    renderCount++;
    try {
      const svg = renderFigure(v.spec);
      figBox.innerHTML = svg;
    } catch (e) {
      errorCount++;
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = `渲染失敗：${e.message}`;
      figBox.appendChild(err);
    }
    box.appendChild(figBox);

    if (v.note) {
      const note = document.createElement("div");
      note.style.cssText = "margin-top:8px;font-size:12px;color:#92400e;font-weight:700;";
      note.textContent = v.note;
      box.appendChild(note);
    }

    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(v.spec, null, 2);
    box.appendChild(pre);

    variantsWrap.appendChild(box);
  }

  section.appendChild(variantsWrap);
  app.appendChild(section);
}

// 型別涵蓋檢查：BUILD_CONTRACT §2.3 第 1-9 號 ＋ figure-specs.json 補的
// segment_compare／number_line／space_relations（原標 TODO_JS）都要出現在 SUPPORTED 裡
const expected = [
  "clock_face", "digital_clock", "calendar", "ten_frame", "place_value_board",
  "column_arithmetic", "count_group", "unit_ruler", "pictogram",
  "segment_compare", "number_line", "space_relations", "array_model",
  "line_relation", "shape_dimension", "capacity_container", "balance_scale",
  "fraction_model",
];
const missing = expected.filter((t) => !SUPPORTED.includes(t));

if (errorCount === 0 && missing.length === 0) {
  statusEl.className = "ok";
  statusEl.textContent = `✅ 全部通過：${renderCount} 個渲染成功，SUPPORTED 涵蓋全部 ${expected.length} 個元件（${SUPPORTED.join(", ")}）`;
} else {
  statusEl.className = "fail";
  const msgs = [];
  if (errorCount) msgs.push(`${errorCount} 個渲染失敗`);
  if (missing.length) msgs.push(`SUPPORTED 缺少：${missing.join(", ")}`);
  statusEl.textContent = `❌ ${msgs.join("；")}`;
}
</script>
</body>
</html>
