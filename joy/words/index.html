 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>grade(p.options[Number(b.dataset.answer)].key===w.key,p.options[Number(b.dataset.answer)]));document.querySelectorAll('[data-option-zh]').forEach(b=>b.onclick=()=>zh(p.options[Number(b.dataset.optionZh)].zh));document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>grade(b.dataset.letter===p.answer,{say:b.dataset.letter}));
 document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{p.picked.push(p.tiles[Number(b.dataset.tile)]);renderTask();});if($('#undo'))$('#undo').onclick=()=>{p.picked.pop();renderTask();};if($('#check'))$('#check').onclick=()=>{if(p.picked.length!==w.word.length){zh('還有字母沒有放進來，慢慢來。');return;}grade(p.picked.map(x=>x.c).join('')===w.word.toLowerCase());};
 if($('#hint'))$('#hint').onclick=()=>{session.hinted.add(taskKey(t));p.helped=true;renderTask();speakSequence([['一起看一看，跟著再試一次。','zh-TW'],[w.say||w.word,'en-US']]);};if($('#next'))$('#next').onclick=()=>{session.advance();renderTask();announceTask();};window.scrollTo({top:0,behavior:'instant'});
}
function bindSounds(w){document.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>en(w));document.querySelectorAll('[data-zh]').forEach(b=>b.onclick=()=>zh(w.zh));}
function announceTask(){if(!session)return;if(session.phase==='reviewReady'){zh('作答已完成。接下來練剛才的錯題，不增加新字。');return;}if(session.phase==='complete'){zh('今天的小花開好了，你願意再試一次，很棒！');return;}const t=session.current();speakSequence([[promptText(t),'zh-TW'],[t.word.say||t.word.word,'en-US'],...(t.kind==='learn'?[[t.word.zh,'zh-TW']]:[])]);}
function grade(ok,selected=null){if(session.feedback)return;const t=session.current();session.record(ok);renderTask();if(!ok&&selected)speakSequence([[selected.say||selected.word,'en-US'],['一起記住它，最後再練這一題。','zh-TW'],[t.word.say||t.word.word,'en-US']]);else zh(ok?'做到了！':session.phase==='first'?'一起記住它，最後再練這一題。':'慢慢來，一起看提示再試一次。');}

function renderReviewReady(){view='practice';$('#app').innerHTML=`<section class="panel empty"><span class="stage">作答已完成</span><h1>三個小種子，<br>都練過了。</h1>${garden(session.words.length,session.words.length)}<p>還有 ${session.wrong.size} 題，陪它再長大一點。</p><button class="listen" id="reviewListen">🔊 聽接下來怎麼玩</button><div class="actions"><button class="primary" id="retry">開始錯題挑戰</button></div><p class="muted">這些都是剛才的字，不會增加新字。</p></section>`;$('#retry').onclick=()=>{session.beginRetries();renderTask();announceTask();};$('#reviewListen').onclick=()=>zh('今天的新字都練過了。接下來，把剛才需要幫忙的題目再練一次，不會增加新的單字。');window.scrollTo(0,0);}
function saveCompleted(){if(session.saved)return;const date=today();for(const w of session.words){const r=profile.records[key(w)]||(profile.records[key(w)]={fillDays:[],spellDays:[]});r.lastSeen=date;for(const kind of ['fill','spell']){const stat=session.stats[w.key+'|'+kind];if(stat?.independent>0&&!r[kind+'Days'].includes(date))r[kind+'Days'].push(date);}}profile.days[date]=(profile.days[date]||0)+session.words.length;persist();session.saved=true;}
const kinds={meaning:'聽懂',fill:'補字',spell:'整字拼寫'};
function completionMessage(){const rows=Object.values(session.stats),attempts=rows.reduce((n,x)=>n+x.attempts,0);return `${session.name} Joy 單字小花園完成。\n第一／二冊：第 ${session.book} 冊，第 ${session.unit} 課\n日期：${today()}\nCompleted ${session.words.length} / ${session.words.length} 個字\n總練習：${attempts} 次\n完成項目：認識單字、聽懂挑戰、適用的補字／拼字、錯題挑戰\n口說練習：本頁自由跟讀，未錄音計次\n星星紀錄：未使用星等評分\n單字明細：\n${rows.map(x=>`${x.word} · ${kinds[x.kind]}：${x.attempts} 次，無提示答對 ${x.independent} 次${x.correct>x.independent?'，含有幫忙完成':''}`).join('\n')}`;}
function renderComplete(){view='complete';saveCompleted();$('#app').innerHTML=`<section class="panel empty"><span class="stage">恭喜完成</span><h1>今天的小花，<br>開好了！</h1>${garden(session.words.length,session.words.length)}<div class="word-preview" style="justify-content:center">${session.words.map(w=>`<span>${esc(w.word)}</span>`).join('')}</div><p>新字 ${session.words.length} 個，錯題挑戰也完成了。</p><button class="listen" id="celebrate">🔊 聽聽鼓勵</button></section><section class="panel"><h2>給媽媽看一看</h2><p class="muted">聽懂、補字和整字拼寫分開記錄；使用提示完成，也會如實列出。</p><div class="stats-list">${Object.values(session.stats).map(x=>`<div class="stats-row"><b>${esc(x.word)}</b> · ${kinds[x.kind]}<br>${x.attempts} 次練習，${x.independent} 次無提示答對${x.correct>x.independent?' · 有幫忙完成':''}</div>`).join('')}</div><div class="actions"><button id="notify" class="primary" ${session.notified||notifyBusy?'disabled':''}>${session.notified?'✓ 已通知 Emma':notifyBusy?'正在傳送…':'媽媽確認完成，通知 Emma'}</button></div><p id="notifyStatus" role="status" class="muted">${session.notified?'這次完成紀錄已傳送。':'媽媽確認後才會傳送，不會自動發送。'}</p><button class="soft wide" id="backHome">回到小花園</button></section>`;$('#celebrate').onclick=()=>zh('今天的三個小種子，都長大了。你願意再試一次，很棒！');$('#backHome').onclick=renderHome;$('#notify').onclick=notifyParent;window.scrollTo(0,0);}
async function notifyParent(){if(!session||session.phase!=='complete'||session.wrong.size||session.notified||notifyBusy)return;const target=session,message=completionMessage();notifyBusy=true;renderComplete();const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),15000);try{const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:message}),signal:abort.signal});const result=await response.json();if(!response.ok||result.ok!==true)throw Error();target.notified=true;toast('已把這次的練習紀錄傳給 Emma。');}catch(e){toast('還沒傳送成功，請檢查網路後再按一次。');}finally{clearTimeout(timer);notifyBusy=false;if(session===target&&view==='complete')renderComplete();}}
function exportProgress(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({app:STORAGE,version:1,profile},null,2)],{type:'application/json'}));a.href=url;a.download='Joy單字學習紀錄-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importProgress(e){const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();const x=JSON.parse(await f.text());if(x.app!==STORAGE||x.version!==1||!x.profile||!x.profile.records||typeof x.profile.records!=='object'||Array.isArray(x.profile.records)||!x.profile.days||![1,2].includes(Number(x.profile.book))||!Number.isInteger(Number(x.profile.unit))||x.profile.unit<1||x.profile.unit>20)throw Error();const ids=new Set(ALL.map(w=>w.key));for(const [id,r] of Object.entries(x.profile.records)){if(!ids.has(id)||!r||!Array.isArray(r.fillDays)||!Array.isArray(r.spellDays)||[...r.fillDays,...r.spellDays].some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d)))throw Error();}profile={...profile,...x.profile};session=null;persist();renderHome();toast('學習紀錄已匯入。');}catch(err){toast('這不是有效的 Joy 單字學習紀錄。');}}
$('#home').onclick=()=>{stopSpeech();renderHome();};renderHome();
</script></body></html>
